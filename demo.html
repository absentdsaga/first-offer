<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>FIRST OFFER - engine demo</title>
<style>
  body { font: 14px/1.4 monospace; background: #111; color: #eee; max-width: 820px; margin: 20px auto; padding: 0 12px; }
  button, select, input { font: inherit; padding: 6px 10px; }
  .row { display: flex; gap: 8px; align-items: center; margin: 8px 0; flex-wrap: wrap; }
  .bar { flex: 1; height: 22px; background: #333; position: relative; min-width: 200px; }
  .bar div { height: 100%; transition: width .3s; }
  .bar span { position: absolute; left: 6px; top: 2px; }
  #bossBar div { background: #e33; } #playerBar div { background: #3c3; }
  #text { flex: 1; min-width: 240px; }
  #log { background: #000; border: 1px solid #444; height: 320px; overflow-y: auto; padding: 8px; white-space: pre-wrap; }
  #interim { color: #888; min-height: 1.4em; }
  .boss { color: #f88; } .player { color: #8f8; } .hit { color: #fc4; } .err { color: #888; } .ko { color: #fff; background: #a00; }
  #mic.on { background: #c00; color: #fff; }
</style>
</head>
<body>
<h2>FIRST OFFER &mdash; engine test page</h2>
<div class="row">
  <select id="cart"></select> <select id="boss"></select>
  <button id="startBtn">START</button>
  <button id="mic">MIC OFF</button>
  <label><input type="checkbox" id="offline"> offline scorer</label>
</div>
<div class="row"><label>API <input id="url" size="50"></label></div>
<div class="row">BOSS&nbsp;&nbsp;&nbsp;<div class="bar" id="bossBar"><div style="width:100%"></div><span>100</span></div></div>
<div class="row">PLAYER&nbsp;<div class="bar" id="playerBar"><div style="width:100%"></div><span>100</span></div></div>
<div class="row">VALUE: <b id="value">0</b> <span id="thinking"></span></div>
<div class="row"><input id="text" placeholder="Type your line and press Enter"> <button id="send">SAY</button></div>
<div id="interim"></div>
<div id="log"></div>
<script src="cartridges.js"></script>
<script src="engine.js"></script>
<script>
(function () {
  var F = window.FirstOffer, C = F.cartridges(), $ = function (id) { return document.getElementById(id); };
  function log(cls, msg) {
    var d = document.createElement('div'); d.className = cls; d.textContent = msg;
    $('log').appendChild(d); $('log').scrollTop = $('log').scrollHeight;
  }
  function fillBosses() {
    $('boss').innerHTML = '';
    C[$('cart').value].bosses.forEach(function (b, i) { var o = document.createElement('option'); o.value = i; o.textContent = b.name; $('boss').appendChild(o); });
  }
  Object.keys(C).forEach(function (id) { var o = document.createElement('option'); o.value = id; o.textContent = C[id].title; $('cart').appendChild(o); });
  $('cart').onchange = fillBosses; fillBosses();
  $('url').value = F.config.url;
  $('url').onchange = function () { F.config.url = $('url').value.trim(); };
  $('offline').onchange = function () { F.config.offline = $('offline').checked; };
  $('startBtn').onclick = function () { $('log').innerHTML = ''; F.start($('cart').value, +$('boss').value); };
  $('mic').onclick = function () {
    if (F.isListening()) F.stopListening(); else F.listen();
    $('mic').className = F.isListening() ? 'on' : ''; $('mic').textContent = F.isListening() ? 'MIC ON' : 'MIC OFF';
  };
  function send() { F.say($('text').value); $('text').value = ''; $('text').focus(); }
  $('send').onclick = send;
  $('text').onkeydown = function (e) { if (e.key === 'Enter') send(); };
  function bar(id, v) { $(id).firstElementChild.style.width = v + '%'; $(id).lastElementChild.textContent = v; }
  F.on('bossLine', function (e) { log('boss', 'BOSS: ' + e.text); })
   .on('playerLine', function (e) { log('player', 'YOU:  ' + e.text); })
   .on('interim', function (e) { $('interim').textContent = e.text ? '... ' + e.text : ''; })
   .on('hit', function (e) { log('hit', '  HIT ' + e.move + ' -' + e.dmg + ' -> ' + e.target); })
   .on('score', function (e) { bar('bossBar', e.bossHP); bar('playerBar', e.playerHP); $('value').textContent = e.value + (e.offline ? ' (offline)' : ''); })
   .on('ko', function (e) { log('ko', '*** ' + e.winner.toUpperCase() + ' WINS *** ' + e.summary); })
   .on('thinking', function (e) { $('thinking').textContent = e.on ? 'thinking...' : ''; })
   .on('error', function (e) {
     log('err', '[error] ' + e.message);
     if (!F.isListening()) { $('mic').className = ''; $('mic').textContent = 'MIC OFF'; }
   });
})();
</script>
</body>
</html>
